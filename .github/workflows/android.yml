name: Android CI

on: [push, workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
       submodule: "recursive"
      
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: get mg
      run: git clone https://github.com/ItsWinterBush26/MobileGlues.git
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew :MobileGlues:assembleRelease
    - name: Upload AAR
      uses: actions/upload-artifact@v4.6.0
      if: startsWith(github.ref, 'refs/tags/') != true
      with:
         name: output-aar
         path: MobileGlues/build/outputs/aar/MobileGlues-release.aar
         if-no-files-found: error
         retention-days: 7
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with: 
        files: MobileGlues/build/outputs/aar/MobileGlues-release.aar
       
