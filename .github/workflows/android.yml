name: Android CI

on: [workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main
    - name: Upload LTW
      uses: actions/upload-artifact@main
      with:
         name: output-aar
         path: libs/arm64-v8a/libltw.so
         if-no-files-found: error
       
